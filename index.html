<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조용란 공인중개사사무소</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f4f8ff;
      color: #0756b8;
    }
    .card {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 55px 25px 35px;
      display: flex;
      flex-direction: column;
    }
    .top {
      text-align: center;
      margin-bottom: 45px;
    }
    .top h1 {
      margin: 0 0 12px;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -2px;
    }
    .top p {
      margin: 0;
      font-size: 19px;
      line-height: 1.6;
      font-weight: 600;
    }
    .services {
      display: grid;
      gap: 18px;
      flex: 1;
    }
    .service {
      background: #fff;
      border: 2px solid #d7e7ff;
      border-radius: 20px;
      padding: 25px 20px;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 86, 184, .08);
    }
    .number {
      display: inline-flex;
      width: 38px;
      height: 38px;
      margin-right: 10px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #0b63ce;
      color: #fff;
      font-size: 19px;
    }
    .contact {
      display: block;
      margin-top: 35px;
      padding: 19px;
      border-radius: 16px;
      background: #0756b8;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 24px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(0, 86, 184, .25);
    }
    .contact:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main class="card">
    <header class="top">
      <h1>조용란</h1>
      <p>공인중개사사무소 대표<br>믿음과 전문성을 바탕으로 함께하겠습니다.</p>
    </header>

    <section class="services">
      <div class="service">
        <span class="number">1</span>부동산 권리분석
      </div>
      <div class="service">
        <span class="number">2</span>공인중개
      </div>
      <div class="service">
        <span class="number">3</span>사후관리
      </div>
    </section>

    <a class="contact" href="tel:010-0000-0000">문의하기</a>
  </main>
</body>
</html>
